<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pomodoro</title>
<style>
  :root {
    --bg: #191919;
    --panel: #191919;
    --ring: #E8D5A8;
    --accent: #E8D5A8;
    --accent-dim: #6b5f45;
    --track: #2A231D;
    --sub: #1B3A4B;
    --text: #F0E6D8;
    --text-muted: #a89a86;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); width: 100%; min-height: 100%; overflow-x: hidden; overflow-y: auto;
    font-family: 'Georgia', 'Times New Roman', serif; color: var(--text);
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  .card {
    width: 340px; margin: 0; padding: 26px 22px 15px 20px;
    background: var(--panel); border-radius: 4px; text-align: center; position: relative;
    transform-origin: top left; flex-shrink: 0;
  }
  .mode-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .mode-btn {
    background: none; border: 1px solid var(--accent-dim); color: var(--text-muted);
    font-family: inherit; font-size: 9px; letter-spacing: 0.1em; padding: 4px 9px;
    border-radius: 2px; cursor: pointer; transition: all 0.2s ease;
  }
  .mode-btn.active { border-color: var(--accent); color: var(--accent); }
  .main-row { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .cycle-dots { display: flex; justify-content: center; gap: 5px; margin-bottom: 9px; }
  .cdot { width: 6px; height: 6px; border-radius: 50%; background: var(--track); border: 1px solid var(--accent-dim); }
  .cdot.filled { background: var(--accent); border-color: var(--accent); }
  .cdot.current { box-shadow: 0 0 0 2px var(--sub); }
  .ring-wrap { position: relative; width: 122px; height: 122px; flex-shrink: 0; }
  svg { transform: none; }
  .ring-track { stroke: var(--track); fill: none; stroke-width: 4; }
  .ring-progress { fill: none; stroke-width: 4; stroke-linecap: round; transition: d 1s linear, stroke 0.3s ease; }
  .time-display { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .time { font-size: 25px; letter-spacing: 0.02em; color: var(--text); font-variant-numeric: tabular-nums; }
  .label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 8px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-top: 3px; opacity: 0.8; }
  .right-col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .total-time { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; letter-spacing: 0.04em; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; justify-content: center; gap: 6px; }
  .btn { background: none; border: 1px solid var(--accent); color: var(--accent); font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; letter-spacing: 0.1em; padding: 9px 14px; border-radius: 2px; cursor: pointer; transition: all 0.2s ease; }
  .btn:hover { background: var(--accent); color: var(--panel); }
  .btn.ghost { border-color: var(--accent-dim); color: var(--text-muted); padding: 9px 11px; }
  .btn.ghost:hover { background: var(--accent-dim); color: var(--text); }
  .icon-row { display: flex; justify-content: center; gap: 16px; }
  .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; opacity: 0.55; transition: opacity 0.2s ease; padding: 2px; }
  .icon-btn:hover { opacity: 1; }
  .icon-btn.off { opacity: 0.3; }
  .gear { position: absolute; top: 10px; left: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; opacity: 0.6; }
  .gear:hover { opacity: 1; }
  .settings { display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--track); text-align: left; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .settings.open { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.02em; }
  .stepper { display: flex; align-items: center; gap: 3px; }
  .stepper button { width: 16px; height: 16px; background: var(--track); border: 1px solid var(--accent-dim); color: var(--text); cursor: pointer; border-radius: 2px; font-size: 10px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .row input[type="number"] { width: 32px; background: var(--track); border: 1px solid var(--accent-dim); color: var(--text); font-family: inherit; padding: 2px 3px; border-radius: 2px; text-align: center; }
  .color-input-group { display: flex; align-items: center; gap: 4px; }
  .row input[type="color"] { width: 22px; height: 20px; border: 1px solid var(--accent-dim); background: none; border-radius: 2px; padding: 0; cursor: pointer; }
  .row input[type="text"].hex { width: 56px; background: var(--track); border: 1px solid var(--accent-dim); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; padding: 2px 4px; border-radius: 2px; font-size: 9px; letter-spacing: 0.02em; text-transform: uppercase; }
  .section-title { font-size: 9px; letter-spacing: 0.15em; color: var(--accent); opacity: 0.7; margin: 14px 0 8px; text-transform: uppercase; }
  select { background: var(--track); border: 1px solid var(--accent-dim); color: var(--text); font-family: inherit; font-size: 11px; padding: 4px 6px; border-radius: 2px; flex: 1; margin-right: 6px; }
  .preset-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .small-btn { background: none; border: 1px solid var(--accent-dim); color: var(--text-muted); font-size: 10px; padding: 4px 8px; border-radius: 2px; cursor: pointer; white-space: nowrap; }
  .small-btn:hover { border-color: var(--accent); color: var(--accent); }
  .small-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .small-btn:disabled:hover { border-color: var(--accent-dim); color: var(--text-muted); }
</style>
</head>
<body>

<div class="card" id="card">
  <button class="gear" id="gearBtn" title="Settings">&#9881;</button>
  <div class="mode-row">
    <button class="mode-btn active" data-mode="work">WORK</button>
    <button class="mode-btn" data-mode="break">BREAK</button>
    <button class="mode-btn" data-mode="longBreak">LONG</button>
  </div>
  <div class="main-row">
    <div class="ring-wrap">
      <svg width="122" height="122" viewBox="0 0 122 122">
        <circle class="ring-track" cx="61" cy="61" r="54"></circle>
        <path class="ring-progress" id="ringProgress" d=""></path>
      </svg>
      <div class="time-display">
        <div class="time" id="timeText">25:00</div>
        <div class="label" id="modeLabel">FOCUS</div>
      </div>
    </div>
    <div class="right-col">
      <div class="cycle-dots" id="cycleDots"></div>
      <div class="total-time" id="totalTime">TOTAL 0 / 120</div>
      <div class="controls">
        <button class="btn ghost" id="resetBtn">RESET</button>
        <button class="btn" id="startBtn">START</button>
      </div>
      <div class="icon-row">
        <button class="icon-btn" id="muteBtn" title="Sound">♪</button>
        <button class="icon-btn" id="totalToggleBtn" title="Total time">Σ</button>
      </div>
    </div>
  </div>
  <div class="settings" id="settings">
    <div class="section-title">Time (min)</div>
    <div class="row"><span>Work</span><div class="stepper"><button data-target="workMin" data-delta="-1">−</button><input type="number" id="workMin" value="25" min="1" max="180"><button data-target="workMin" data-delta="1">+</button></div></div>
    <div class="row"><span>Break</span><div class="stepper"><button data-target="breakMin" data-delta="-1">−</button><input type="number" id="breakMin" value="5" min="1" max="120"><button data-target="breakMin" data-delta="1">+</button></div></div>
    <div class="row"><span>Long break</span><div class="stepper"><button data-target="longBreakMin" data-delta="-1">−</button><input type="number" id="longBreakMin" value="15" min="1" max="180"><button data-target="longBreakMin" data-delta="1">+</button></div></div>
    <div class="row"><span>Sessions</span><div class="stepper"><button data-target="sessionsBeforeLong" data-delta="-1">−</button><input type="number" id="sessionsBeforeLong" value="4" min="1" max="12"><button data-target="sessionsBeforeLong" data-delta="1">+</button></div></div>

    <div class="section-title">Presets</div>
    <div class="preset-row"><select id="presetSelect"></select><button class="small-btn" id="loadPresetBtn">Load</button><button class="small-btn" id="deletePresetBtn">Delete</button></div>
    <div class="preset-row"><button class="small-btn" id="savePresetBtn" style="width:100%">Save as preset</button></div>

    <div class="section-title">Colors</div>
    <div class="row"><span>Background</span><div class="color-input-group"><input type="color" id="bgColor" value="#191919"><input type="text" class="hex" id="bgColorHex" value="#191919"></div></div>
    <div class="row"><span>Ring</span><div class="color-input-group"><input type="color" id="ringColor" value="#E8D5A8"><input type="text" class="hex" id="ringColorHex" value="#E8D5A8"></div></div>
    <div class="row" title="Used for the ring color during Break and Long Break"><span>Sub</span><div class="color-input-group"><input type="color" id="subColor" value="#1B3A4B"><input type="text" class="hex" id="subColorHex" value="#1B3A4B"></div></div>
    <div class="row"><span>Accent</span><div class="color-input-group"><input type="color" id="accentColor" value="#E8D5A8"><input type="text" class="hex" id="accentColorHex" value="#E8D5A8"></div></div>
    <div class="row"><span>Text</span><div class="color-input-group"><input type="color" id="textColor" value="#F0E6D8"><input type="text" class="hex" id="textColorHex" value="#F0E6D8"></div></div>
    <div class="row"><span>Panel</span><div class="color-input-group"><input type="color" id="panelColor" value="#191919"><input type="text" class="hex" id="panelColorHex" value="#191919"></div></div>
    <div class="row"><span>Track</span><div class="color-input-group"><input type="color" id="trackColor" value="#2A231D"><input type="text" class="hex" id="trackColorHex" value="#2A231D"></div></div>
  </div>
</div>

<script>
  const root = document.documentElement;
  const STORAGE_KEY = 'pomodoro_settings_v2';
  const PRESET_KEY = 'pomodoro_presets_v2';
  const DEFAULT_NAME = 'Default';

  const DEFAULT_SETTINGS = {
    workMin: 25, breakMin: 5, longBreakMin: 15, sessionsBeforeLong: 4,
    muted: false, showTotal: true,
    colors: { bg: '#191919', ring: '#E8D5A8', sub: '#1B3A4B', accent: '#E8D5A8', text: '#F0E6D8', panel: '#191919', track: '#2A231D' }
  };

  const state = {
    mode: 'work', workMin: 25, breakMin: 5, longBreakMin: 15, sessionsBeforeLong: 4,
    remaining: 25 * 60, running: false, timer: null, sessionInCycle: 0,
    muted: false, showTotal: true, completedSecondsInCycle: 0
  };

  const timeText = document.getElementById('timeText');
  const modeLabel = document.getElementById('modeLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const ring = document.getElementById('ringProgress');
  const totalTimeEl = document.getElementById('totalTime');

  function polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function describeArc(cx, cy, r, startAngle, endAngle) {
    if (endAngle - startAngle >= 359.99) {
      const mid = startAngle + 180;
      const p0 = polarToCartesian(cx, cy, r, startAngle);
      const pMid = polarToCartesian(cx, cy, r, mid);
      return `M ${p0.x} ${p0.y} A ${r} ${r} 0 1 1 ${pMid.x} ${pMid.y} A ${r} ${r} 0 1 1 ${p0.x} ${p0.y}`;
    }
    const start = polarToCartesian(cx, cy, r, startAngle);
    const end = polarToCartesian(cx, cy, r, endAngle);
    const largeArcFlag = endAngle - startAngle > 180 ? 1 : 0;
    return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
  }
  // Draws the REMAINING-time arc: starts at the clockwise-moving boundary
  // (which sweeps from 12 o'clock as time elapses) and always closes back at 12.
  function progressArcPath(remainingFraction) {
    const elapsedAngle = (1 - remainingFraction) * 360;
    if (360 - elapsedAngle <= 0.05) return '';
    return describeArc(61, 61, 54, elapsedAngle, 360);
  }

  function durationFor(mode) {
    if (mode === 'work') return state.workMin * 60;
    if (mode === 'break') return state.breakMin * 60;
    return state.longBreakMin * 60;
  }
  function totalCycleMinutes() {
    return state.workMin * state.sessionsBeforeLong + state.breakMin * (state.sessionsBeforeLong - 1) + state.longBreakMin;
  }
  function elapsedInCycleMinutes() {
    const currentElapsed = durationFor(state.mode) - state.remaining;
    return Math.floor((state.completedSecondsInCycle + currentElapsed) / 60);
  }
  function render() {
    const m = Math.floor(state.remaining / 60).toString().padStart(2, '0');
    const s = Math.floor(state.remaining % 60).toString().padStart(2, '0');
    timeText.textContent = `${m}:${s}`;
    modeLabel.textContent = state.mode === 'work' ? 'FOCUS' : state.mode === 'break' ? 'BREAK' : 'LONG';
    const remainingFraction = state.remaining / durationFor(state.mode);
    ring.setAttribute('d', progressArcPath(remainingFraction));
    ring.style.stroke = state.mode === 'work'
      ? document.getElementById('ringColor').value
      : document.getElementById('subColor').value;
    startBtn.textContent = state.running ? 'PAUSE' : 'START';
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
    totalTimeEl.textContent = `TOTAL ${elapsedInCycleMinutes()} / ${totalCycleMinutes()}`;
    totalTimeEl.style.display = state.showTotal ? 'block' : 'none';
    document.getElementById('totalToggleBtn').classList.toggle('off', !state.showTotal);
    document.getElementById('muteBtn').classList.toggle('off', state.muted);
    renderCycleDots();
    document.title = state.running ? `${m}:${s} - ${modeLabel.textContent}` : 'Pomodoro';
  }
  function renderCycleDots() {
    const wrap = document.getElementById('cycleDots');
    wrap.innerHTML = '';
    for (let i = 0; i < state.sessionsBeforeLong; i++) {
      const d = document.createElement('div');
      d.className = 'cdot' + (i < state.sessionInCycle ? ' filled' : '') + (i === state.sessionInCycle && state.mode === 'work' ? ' current' : '');
      wrap.appendChild(d);
    }
  }

  let audioCtx = null;
  function beep(freq, duration) {
    if (state.muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function tick() {
    if (state.remaining > 0) {
      state.remaining--;
      if (state.remaining > 0 && state.remaining <= 2) beep(880, 0.15);
      render();
    }
    if (state.remaining <= 0) {
      beep(523, 0.4);
      state.completedSecondsInCycle += durationFor(state.mode);
      if (state.mode === 'work') {
        state.sessionInCycle++;
        state.mode = state.sessionInCycle >= state.sessionsBeforeLong ? 'longBreak' : 'break';
      } else if (state.mode === 'longBreak') {
        state.sessionInCycle = 0;
        state.mode = 'work';
        state.completedSecondsInCycle = 0;
      } else {
        state.mode = 'work';
      }
      state.remaining = durationFor(state.mode);
      render();
    }
  }

  startBtn.addEventListener('click', () => {
    state.running = !state.running;
    if (state.running) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      state.timer = setInterval(tick, 1000);
    } else {
      clearInterval(state.timer);
    }
    render();
  });
  resetBtn.addEventListener('click', () => {
    state.running = false;
    clearInterval(state.timer);
    state.remaining = durationFor(state.mode);
    render();
  });
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.running = false;
      clearInterval(state.timer);
      state.mode = btn.dataset.mode;
      state.remaining = durationFor(state.mode);
      render();
    });
  });
  document.getElementById('gearBtn').addEventListener('click', () => {
    document.getElementById('settings').classList.toggle('open');
    fitScale();
  });
  document.getElementById('muteBtn').addEventListener('click', () => {
    state.muted = !state.muted;
    render();
    saveSettings();
  });
  document.getElementById('totalToggleBtn').addEventListener('click', () => {
    state.showTotal = !state.showTotal;
    render();
    saveSettings();
  });
  ['workMin', 'breakMin', 'longBreakMin', 'sessionsBeforeLong'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      state[id] = Math.max(1, parseInt(e.target.value) || 1);
      if (!state.running && (id === 'sessionsBeforeLong' ||
          (id === 'workMin' && state.mode === 'work') ||
          (id === 'breakMin' && state.mode === 'break') ||
          (id === 'longBreakMin' && state.mode === 'longBreak'))) {
        state.remaining = durationFor(state.mode);
      }
      render();
      saveSettings();
    });
  });
  document.querySelectorAll('.stepper button').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target;
      const delta = parseInt(btn.dataset.delta);
      const input = document.getElementById(target);
      const newVal = Math.max(1, (parseInt(input.value) || 0) + delta);
      input.value = newVal;
      input.dispatchEvent(new Event('input'));
    });
  });

  // colors: picker <-> hex text, both ways, plus CSS var + render
  const colorIds = ['bg', 'ring', 'sub', 'accent', 'text', 'panel', 'track'];
  function applyColor(key, hex) {
    root.style.setProperty('--' + key, hex);
  }
  colorIds.forEach(key => {
    const picker = document.getElementById(key + 'Color');
    const hexInput = document.getElementById(key + 'ColorHex');
    picker.addEventListener('input', e => {
      hexInput.value = e.target.value.toUpperCase();
      applyColor(key, e.target.value);
      render();
      saveSettings();
    });
    hexInput.addEventListener('change', e => {
      let v = e.target.value.trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9A-Fa-f]{6}$/.test(v)) {
        picker.value = v;
        hexInput.value = v.toUpperCase();
        applyColor(key, v);
        render();
        saveSettings();
      } else {
        hexInput.value = picker.value.toUpperCase();
      }
    });
  });

  function currentSettingsObj() {
    const colors = {};
    colorIds.forEach(key => { colors[key] = document.getElementById(key + 'Color').value; });
    return {
      workMin: state.workMin, breakMin: state.breakMin, longBreakMin: state.longBreakMin,
      sessionsBeforeLong: state.sessionsBeforeLong, muted: state.muted, showTotal: state.showTotal,
      colors
    };
  }
  function saveSettings() { localStorage.setItem(STORAGE_KEY, JSON.stringify(currentSettingsObj())); }
  function applySettingsObj(obj) {
    state.workMin = obj.workMin; state.breakMin = obj.breakMin;
    state.longBreakMin = obj.longBreakMin; state.sessionsBeforeLong = obj.sessionsBeforeLong;
    state.muted = obj.muted || false; state.showTotal = obj.showTotal !== false;
    document.getElementById('workMin').value = obj.workMin;
    document.getElementById('breakMin').value = obj.breakMin;
    document.getElementById('longBreakMin').value = obj.longBreakMin;
    document.getElementById('sessionsBeforeLong').value = obj.sessionsBeforeLong;
    if (obj.colors) {
      colorIds.forEach(key => {
        if (obj.colors[key]) {
          document.getElementById(key + 'Color').value = obj.colors[key];
          document.getElementById(key + 'ColorHex').value = obj.colors[key].toUpperCase();
          applyColor(key, obj.colors[key]);
        }
      });
    }
    state.sessionInCycle = 0;
    state.completedSecondsInCycle = 0;
    state.remaining = durationFor(state.mode);
    render();
  }
  function loadSettings() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { applySettingsObj(JSON.parse(raw)); return; } catch (e) {} }
    applySettingsObj(DEFAULT_SETTINGS);
  }

  function getPresets() {
    try {
      const p = JSON.parse(localStorage.getItem(PRESET_KEY)) || {};
      if (!p[DEFAULT_NAME]) p[DEFAULT_NAME] = DEFAULT_SETTINGS;
      return p;
    } catch (e) { return { [DEFAULT_NAME]: DEFAULT_SETTINGS }; }
  }
  function savePresets(p) { localStorage.setItem(PRESET_KEY, JSON.stringify(p)); }
  function refreshPresetSelect() {
    const sel = document.getElementById('presetSelect');
    const presets = getPresets();
    const prevValue = sel.value;
    sel.innerHTML = '';
    Object.keys(presets).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    sel.value = presets[prevValue] ? prevValue : DEFAULT_NAME;
    document.getElementById('deletePresetBtn').disabled = (sel.value === DEFAULT_NAME);
  }
  document.getElementById('presetSelect').addEventListener('change', e => {
    document.getElementById('deletePresetBtn').disabled = (e.target.value === DEFAULT_NAME);
  });
  document.getElementById('savePresetBtn').addEventListener('click', () => {
    const name = prompt('Preset name?');
    if (!name || name === DEFAULT_NAME) { if (name === DEFAULT_NAME) alert('That name is reserved.'); return; }
    const presets = getPresets();
    presets[name] = currentSettingsObj();
    savePresets(presets);
    refreshPresetSelect();
    document.getElementById('presetSelect').value = name;
    document.getElementById('deletePresetBtn').disabled = false;
  });
  document.getElementById('loadPresetBtn').addEventListener('click', () => {
    const name = document.getElementById('presetSelect').value;
    const presets = getPresets();
    if (presets[name]) applySettingsObj(presets[name]);
    saveSettings();
  });
  document.getElementById('deletePresetBtn').addEventListener('click', () => {
    const name = document.getElementById('presetSelect').value;
    if (name === DEFAULT_NAME) return;
    if (!confirm(`Delete preset "${name}"?`)) return;
    const presets = getPresets();
    delete presets[name];
    savePresets(presets);
    refreshPresetSelect();
  });

  savePresets(getPresets());
  loadSettings();
  refreshPresetSelect();
  render();

  // --- auto-scale to fit the embed container ---
  const cardEl = document.getElementById('card');
  function fitScale() {
    cardEl.style.transform = 'scale(1)';
    const baseW = cardEl.offsetWidth;
    if (!baseW) return;
    const availW = document.documentElement.clientWidth;
    const scale = availW / baseW;
    cardEl.style.transform = `scale(${Math.min(Math.max(scale, 0.3), 3)})`;
  }
  window.addEventListener('resize', fitScale);
  if (window.ResizeObserver) {
    new ResizeObserver(fitScale).observe(document.documentElement);
  }
  window.addEventListener('load', fitScale);
  fitScale();

</script>
